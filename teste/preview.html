<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orion Store TESTE</title><style>
:root{font-family:system-ui,Segoe UI,Arial;background:#071120;color:#edf6ff}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{background:#0c1b32;padding:28px 20px;border-right:1px solid #244266}aside h1{font-size:22px;letter-spacing:3px;margin-bottom:40px}aside h1 span{color:#4cbcff}nav button{display:block;width:100%;text-align:left;margin:10px 0;padding:13px;background:none;border:0;color:#a9c3df;border-radius:8px;font-size:16px}nav button:hover,nav button:focus,nav button.active{background:#153e6a;color:#fff;outline:2px solid #4cbcff}main{padding:35px 5vw;max-width:1300px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}header small{color:#85acd0}h2{font-size:30px}p{color:#adc5db;line-height:1.55}.banner{padding:28px;border-radius:14px;background:linear-gradient(115deg,#10487e,#0b2440);margin:26px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.game{background:#102440;border:1px solid #2a4966;border-radius:12px;overflow:hidden}.art{height:180px;display:grid;place-items:center;font-size:58px;background:linear-gradient(130deg,#10345e,#193f66)}.game:nth-child(2) .art{background:linear-gradient(130deg,#122b50,#482e7b)}.game:nth-child(3) .art{background:linear-gradient(130deg,#103e48,#17575a)}.game section{padding:17px}.game h3{margin:0 0 8px}.tag{font-size:12px;color:#87caff}.btn{border:0;background:#167be0;color:#fff;padding:11px 17px;border-radius:7px;cursor:pointer;font-size:15px}.btn:hover,.btn:focus{outline:2px solid #8ad7ff}.secondary{background:#1c3858}.muted{color:#9db3c9}.detail{margin-top:25px;padding:22px;border:1px solid #2b5278;background:#0d2037;border-radius:12px}.option{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid #29415a;padding:14px 0}.pill{font-size:12px;border-radius:20px;padding:4px 10px;background:#2e354b;color:#c3d5ed}.note{border-left:3px solid #63b8ff;padding-left:14px}footer{margin-top:40px;color:#8ea8c2;font-size:12px}@media(max-width:680px){.shell{grid-template-columns:1fr}aside{padding:12px}aside h1{margin:0}nav{display:flex;gap:4px;overflow:auto}nav button{white-space:nowrap}main{padding:18px}}</style></head>
<body><div class="shell"><aside><h1>ORION <span>TESTE</span></h1><nav><button class="active" data-view="inicio">⌂ Início</button><button data-view="catalogo">▦ Jogos</button><button data-view="downloads">↓ Downloads</button><button data-view="info">ⓘ Sobre</button></nav></aside><main><header><div><small>PS4 • Edição de avaliação</small><h2 id="heading">Loja TESTE</h2></div><span class="pill">3 títulos</span></header><div id="content"></div><footer>Protótipo de interface • Sem propagandas • Sem navegador externo • Não instala PKG nesta versão</footer></main></div>
<script>
const items=[{id:"rayman",title:"Rayman Legends",art:"✦",kind:"Referência comercial",description:"Jogo comercial apresentado somente como referência de catálogo. Download não autorizado não está disponível.",audio:"Não confirmado",subs:"Não confirmado",ui:"Não confirmado",options:["Versão PS4","Atualização"]},{id:"orbita",title:"Órbita Neon",art:"◉",kind:"Minijogo original",description:"Desvie de obstáculos em um arcade espacial minimalista. Protótipo HTML disponível no projeto-fonte.",audio:"Sem diálogos",subs:"Não se aplica",ui:"Português (BR)",options:["Jogo base","Versão leve"]},{id:"labirinto",title:"Labirinto de Luz",art:"◇",kind:"Minijogo original",description:"Resolva pequenos labirintos e encontre a saída. Protótipo HTML disponível no projeto-fonte.",audio:"Sem diálogos",subs:"Não se aplica",ui:"Português (BR)",options:["Jogo base","Versão leve"]}];
const content=document.getElementById("content"),heading=document.getElementById("heading");
function cards(){return '<div class="grid">'+items.map(g=>'<article class="game"><div class="art">'+g.art+'</div><section><div class="tag">'+g.kind+'</div><h3>'+g.title+'</h3><button class="btn" data-game="'+g.id+'">Ver detalhes</button></section></article>').join('')+'</div>'}
function show(view){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));heading.textContent=({inicio:"Loja TESTE",catalogo:"Catálogo de jogos",downloads:"Downloads",info:"Sobre a edição TESTE"})[view]||"Loja TESTE";if(view==="inicio")content.innerHTML='<div class="banner"><h2>Três jogos. Nenhum anúncio.</h2><p>Versão de avaliação para testar interface, idiomas e opções de download.</p></div>'+cards();else if(view==="catalogo")content.innerHTML=cards();else if(view==="downloads")content.innerHTML='<div class="detail"><h3>Nenhum download disponível</h3><p>O download direto e a instalação automática no PS4 ainda dependem da integração BGFT e de PKGs autorizados, compilados e testados.</p></div>';else content.innerHTML='<div class="detail"><h3>Orion Store TESTE 0.3</h3><p>Prévia demonstrativa, não um PKG instalável. Sem links para jogos comerciais não autorizados. A loja completa é desenvolvida separadamente.</p></div>'}
function detail(id){const g=items.find(x=>x.id===id);if(!g)return;heading.textContent=g.title;content.innerHTML='<div class="detail"><button class="btn secondary" id="back">← Voltar</button><h2>'+g.art+' '+g.title+'</h2><p>'+g.description+'</p><h3>Idiomas</h3><p>Áudio PT-BR: <b>'+g.audio+'</b><br>Legendas PT-BR: <b>'+g.subs+'</b><br>Interface: <b>'+g.ui+'</b></p><h3>Opções de download</h3>'+g.options.map(o=>'<div class="option"><div><strong>'+o+'</strong><div class="muted">Arquivo PKG ainda não disponível</div></div><button class="btn secondary" disabled>Indisponível</button></div>').join('')+'<p class="note">Nenhuma opção abre sites ou inicia downloads não verificados.</p></div>';document.getElementById("back").onclick=()=>show("catalogo")}
document.addEventListener("click",e=>{const v=e.target.closest("[data-view]");if(v)show(v.dataset.view);const g=e.target.closest("[data-game]");if(g)detail(g.dataset.game)});show("inicio");
</script></body></html>
