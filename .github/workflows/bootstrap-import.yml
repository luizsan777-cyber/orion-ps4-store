name: Importar fonte Alpha 0.2
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/orion-source.tar.xz'
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e importar fontes sem modificar workflows
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/orion-source.tar.xz
          echo "d7210d6e3081bb2ce9a349f74d6ca2e39478c43dfa2c219ee7666382f9b18c60  bootstrap/orion-source.tar.xz" | sha256sum -c -
          tar -tJf bootstrap/orion-source.tar.xz > /tmp/archive-paths
          test "$(wc -l < /tmp/archive-paths)" -ge 30
          if grep -Eq '^(/|.*\.\./)' /tmp/archive-paths; then echo 'Unsafe archive paths'; exit 1; fi
          tar -xJf bootstrap/orion-source.tar.xz
          rm -f .github/workflows/preview.yml .github/workflows/validate.yml
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publicar codigo Orion PS4 Store alpha 0.2"
          git push origin HEAD:main
