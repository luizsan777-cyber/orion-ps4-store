name: Gerar preview da Orion Store
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: orion-store-web-preview
          path: dist/
          if-no-files-found: error
